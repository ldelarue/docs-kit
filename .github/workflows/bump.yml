name: Bump

# release-please only bumps versions, so this workflow is just the bump:
# every push to main lets it open/update the release PR (version bumps in
# pyproject.toml + __version__, CHANGELOG entries); once that PR is merged,
# the run on the merge commit tags that exact commit and creates the GitHub
# Release from the CHANGELOG, then hands the tag + sha to publish.yml, which
# attaches the wheels and moves `latest`.
# publish is called rather than listening for `on: release`, because events
# generated with GITHUB_TOKEN (release.created, the tag push) never start
# workflows; a called workflow always sees the release, no PAT required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two runs must not cut the same release twice; let the second wait, not race.
concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      # On ordinary pushes: keeps one release PR open, aggregating the
      # conventional commits since the last release. On the merge commit of
      # that PR: cuts the release - tags vX.Y.Z and creates the GitHub
      # Release with the CHANGELOG, right here.
      # With GITHUB_TOKEN, CI does not run on the release PR itself (its
      # push never fires ci.yml); the merge-run below is what gates the
      # release for real. To get checks on the PR too, store a PAT with
      # contents+pull-requests write as RELEASE_PLEASE_TOKEN and pass it via
      # with.token below.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    # Reuses publish.yml on the same commit release-please just tagged (the
    # caller's checkout sha): wheels are attached, then `latest` moves to the
    # tagged sha, so the ref people install from never points at a release
    # without its assets.
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      move_latest_to: ${{ needs.release-please.outputs.sha }}
