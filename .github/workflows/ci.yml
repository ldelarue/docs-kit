name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

      - name: lease-port self-tests (shellcheck + port behavior)
        run: sh tests/test_lease_port.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist/ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-kit-dist
          path: dist/
