# GENERATED by docs-kit - do not edit here: `mise run docs:refresh` rewrites
# this file and `docs:check` fails CI on any drift. The tag-pinned `ref`
# below is stamped with the version of the docs-kit CLI that generated it.
name: Documentation
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  # release.created fired with GITHUB_TOKEN never starts `on: release`
  # workflows, so a release pipeline CALLS this workflow on the release commit
  # instead of listening for the event (the same reason bump-style callers
  # reuse publish workflows). The check job skips non-PR events; the deploy
  # job runs for any non-PR event, this one included.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-kit's task layer .docs-kit/ is gitignored - so is the mise opt-in
  # block (mise.local.toml), which is where `docs-kit init` puts the
  # [vars]/[env]/[task_config] keys. None of that exists on a runner, so
  # each job checks docs-kit out (tag-pinned) and recreates the same three
  # keys in mise.local.toml before mise-action loads; committing the same
  # keys to .mise.toml is a harmless duplicate.
  # No secret needed: ldelarue/docs-kit is public, so actions/checkout's
  # default GITHUB_TOKEN reads the cross-repo clone - which is also why
  # fork PRs work here (they never see secrets, and none are required).
  # NEVER bump ref here by hand: `mise run docs:refresh` (or `docs:init`)
  # re-stamps BOTH jobs to the installed CLI's version, and docs:check
  # refuses the drift. A ref must always name a published tag
  # (git ls-remote --tags https://github.com/ldelarue/docs-kit.git).
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- docs-kit checkout, pin stamped by the generating CLI ---
      - uses: actions/checkout@v7
        with:
          repository: ldelarue/docs-kit
          path: .docs-kit
          ref: v0.4.1
      - run: printf '[vars]\ndocs_kit = "%s/.docs-kit"\n[env]\nDOCS_KIT = "{{ vars.docs_kit }}"\n[task_config]\nincludes = ["{{ vars.docs_kit }}/shared/mise/docs.toml"]\n' "$GITHUB_WORKSPACE" > mise.local.toml

      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run docs:check

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6

      # --- docs-kit checkout, pin stamped by the generating CLI ---
      - uses: actions/checkout@v7
        with:
          repository: ldelarue/docs-kit
          path: .docs-kit
          ref: v0.4.1
      - run: printf '[vars]\ndocs_kit = "%s/.docs-kit"\n[env]\nDOCS_KIT = "{{ vars.docs_kit }}"\n[task_config]\nincludes = ["{{ vars.docs_kit }}/shared/mise/docs.toml"]\n' "$GITHUB_WORKSPACE" > mise.local.toml

      - uses: jdx/mise-action@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
