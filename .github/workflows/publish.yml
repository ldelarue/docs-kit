name: Publish

# Attach the built wheels to a GitHub Release, so consumers can
# `gh release download vX.Y.Z -p '*.whl'` or uv-add them.
# (GitHub has no PyPI/pip index; the release assets + git tag pins are the
# registry flow here — and publishing to PyPI is a non-goal.)

# Called by release.yml in the run that cut the release: release.created and
# the tag push are generated with GITHUB_TOKEN and never fire a `release`/
# `push` trigger, so listening would silently skip. workflow_dispatch stays
# for re-attaching assets to an existing release.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose GitHub Release receives the assets
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, git prefix included (e.g. v0.1.0, not 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Build wheel + sdist
        run: uv build

      - name: Attach dist/ to ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
        # release.yml runs this on the commit release-please just tagged, so
        # the checkout is the tagged tree and the wheels match the tag. The
        # `latest` branch is release.yml's move-latest job, not this one.
