[project]
name = "docs-kit"
version = "0.4.1"
description = "Scaffold and regenerate a Zensical docs site from an OpenAPI spec and/or CLI usage contracts."
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["typer>=0.27.0"]

[project.scripts]
docs-kit = "docs_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # for tests/test_usage_spec.py and the cli:spec task: the helper imports
    # the Typer app through the consumer's venv; docs-kit's own typer app is
    # introspected by the same package that consumers use (cli-standard recipe 1)
    "usage-spec-typer>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
