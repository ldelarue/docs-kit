[project]
name = "docs-kit"
version = "0.2.1"
description = "Scaffold and regenerate a Zensical API documentation site from an OpenAPI spec (stdlib only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docs-kit = "docs_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
