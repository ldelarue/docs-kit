[project]
name = "docs-kit"
version = "0.5.0"
description = "Scaffold and regenerate a Zensical docs site from an OpenAPI spec and/or CLI usage contracts."
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# usage-spec-typer is RUNTIME: `docs-kit spec` imports the consumer's Typer
# app inside the consumer's venv (dependency mode installs docs-kit there),
# so the exporter must be importable wherever the docs-kit console script is.
# zensical is RUNTIME too: `docs-kit serve/build` run `python -m zensical`.
dependencies = [
    "typer>=0.27.2",
    "usage-spec-typer>=1.2.1",
    "zensical>=0.0.62",
]

[project.scripts]
docs-kit = "docs_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
