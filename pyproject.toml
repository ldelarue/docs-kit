[project]
name = "docs-kit"
version = "0.2.0"
description = "Scaffold and regenerate a Zensical API documentation site from an OpenAPI spec (stdlib only)."
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docs-kit = "docs_kit.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
