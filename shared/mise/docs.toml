# docs:* tasks for shim-mode consumers (Go / no-venv repos), included from
# mise.local.toml via [task_config].includes = ["{{ vars.docs_kit }}/shared/mise/docs.toml"].
# Python repos use the committed block of `docs-kit init --with-mise --committed`
# instead. Every body delegates to the docs-kit CLI (PATH first, else the
# kit's own uv project at $DOCS_KIT); the repo's `openapi` / `cli:spec` tasks
# run first only when the repo defines them.
# Bodies must stay POSIX sh (consumer /bin/sh may be dash) on one line:
# tests/test_kit.py::test_shared_mise_bodies_are_posix is the gate.

"docs:init" = { description = "Scaffold this repo or repair the shared-tasks integration block", run = 'case "$DOCS_KIT" in "~/"*) kd="$HOME/${DOCS_KIT#~/}";; *) kd="$DOCS_KIT";; esac; if command -v docs-kit >/dev/null 2>&1; then docs-kit init --with-mise; else uv run --no-dev --project "$kd" docs-kit init --with-mise; fi' }

"docs:refresh" = { description = "Regenerate everything detected: the OpenAPI spec and CLI contracts (only when those tasks exist), then the reference and CLI pages", run = 'case "$DOCS_KIT" in "~/"*) kd="$HOME/${DOCS_KIT#~/}";; *) kd="$DOCS_KIT";; esac; if mise tasks --json 2>/dev/null | grep -qE "\"name\"[[:space:]]*:[[:space:]]*\"openapi\""; then mise run openapi || exit 1; fi; if mise tasks --json 2>/dev/null | grep -qE "\"name\"[[:space:]]*:[[:space:]]*\"cli:spec\""; then mise run cli:spec || exit 1; fi; if command -v docs-kit >/dev/null 2>&1; then docs-kit refresh; else uv run --no-dev --project "$kd" docs-kit refresh; fi' }

"docs:build" = { description = "Refresh, then build the static site into site/", run = 'case "$DOCS_KIT" in "~/"*) kd="$HOME/${DOCS_KIT#~/}";; *) kd="$DOCS_KIT";; esac; mise run docs:refresh || exit 1; if command -v docs-kit >/dev/null 2>&1; then docs-kit build; else uv run --no-dev --project "$kd" docs-kit build; fi' }

"docs:serve" = { description = "Serve the docs with live reload on http://127.0.0.1:$PORT (prefers 8010, falls back to the first free port in 8000-8999; pin exactly via DOCS_PORT)", run = 'case "$DOCS_KIT" in "~/"*) kd="$HOME/${DOCS_KIT#~/}";; *) kd="$DOCS_KIT";; esac; if command -v docs-kit >/dev/null 2>&1; then docs-kit serve; else uv run --no-dev --project "$kd" docs-kit serve; fi' }

"docs:check" = { description = "Fail when generated docs are stale (for CI and git hooks): regenerate, then diff must be empty", run = 'case "$DOCS_KIT" in "~/"*) kd="$HOME/${DOCS_KIT#~/}";; *) kd="$DOCS_KIT";; esac; if mise tasks --json 2>/dev/null | grep -qE "\"name\"[[:space:]]*:[[:space:]]*\"openapi\""; then mise run openapi || exit 1; fi; if mise tasks --json 2>/dev/null | grep -qE "\"name\"[[:space:]]*:[[:space:]]*\"cli:spec\""; then mise run cli:spec || exit 1; fi; if command -v docs-kit >/dev/null 2>&1; then docs-kit check; else uv run --no-dev --project "$kd" docs-kit check; fi && git diff --exit-code -- docs openapi.json cli' }

"docs:pull-tasks" = { description = "Pin the .docs-kit task layer (shared/mise) to the installed CLI's version", run = 'set -eu; shim="${DOCS_KIT:-.docs-kit}"; case "$shim" in /*|"~/"*) echo "checkout install ($shim): nothing to pull - the tasks live in the clone"; exit 0 ;; esac; exec sh "$shim/shared/mise/kit-sync" "$shim"' }
